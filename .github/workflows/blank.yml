      - name: Extrair projeto Android
        run: |
          unzip -o FM-DX-Android-Universal-0.89.0-Satelite-FTA-IPTV.zip -d projeto

      - name: Localizar e dar permissão ao Gradle
        run: |
          WRAPPER=$(find projeto -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: arquivo gradlew não encontrado"
            exit 1
          fi

          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug
